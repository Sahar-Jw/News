name: Build and push Docker images

# Builds both images on GitHub's servers and pushes them to Docker Hub.
# Run it from the Actions tab (Run workflow) or by pushing to main.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  - your Docker Hub username
#   DOCKERHUB_TOKEN     - a Docker Hub access token with Read & Write permission
#
# The frontend runs as a Node server and reads the backend URL at RUNTIME from the API_URL
# environment variable of the container, so nothing needs to be baked in at build time.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/news-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/news-backend:${{ github.run_number }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/news-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/news-frontend:${{ github.run_number }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
